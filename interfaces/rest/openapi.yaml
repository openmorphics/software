openapi: 3.0.3
info:
  title: EventFlow REST API
  description: |
    RESTful API for EventFlow neuromorphic computing platform.

    Provides programmatic access to neuromorphic model validation, execution,
    tracing, and management capabilities through standard HTTP endpoints.
  version: 0.1.0
  contact:
    name: EventFlow Team
    url: https://github.com/eventflow/eventflow

servers:
  - url: http://localhost:8000
    description: Local development server
  - url: https://api.eventflow.dev/v1
    description: Production API

paths:
  # Health and System Status
  /health:
    get:
      summary: Health check endpoint
      description: Returns system health status and basic information
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  # Validation Endpoints
  /validate/eir:
    post:
      summary: Validate EIR document
      description: Validates an EventFlow Intermediate Representation JSON document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: EIR JSON document to validate
      responses:
        '200':
          description: Validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /validate/event-tensor:
    post:
      summary: Validate Event Tensor
      description: Validates Event Tensor JSON or JSONL data
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [json, jsonl]
            default: jsonl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Event Tensor data to validate
          text/plain:
            schema:
              type: string
              description: JSONL content for event tensor validation
      responses:
        '200':
          description: Validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

  /validate/dcd:
    post:
      summary: Validate Device Capability Descriptor
      description: Validates a DCD JSON document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: DCD JSON document to validate
      responses:
        '200':
          description: Validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

  /validate/package:
    post:
      summary: Validate EventFlow Package
      description: Validates an EFPKG manifest and referenced artifacts
      parameters:
        - name: root
          in: query
          schema:
            type: string
            description: Root directory path for relative artifact references
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: EFPKG manifest to validate
      responses:
        '200':
          description: Validation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'

  # Model Management
  /models:
    get:
      summary: List available models
      description: Returns list of available neuromorphic models
      parameters:
        - name: profile
          in: query
          schema:
            type: string
            enum: [BASE, REALTIME, LEARNING, LOWPOWER]
        - name: domain
          in: query
          schema:
            type: string
            description: Filter by application domain
      responses:
        '200':
          description: List of models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ModelSummary'

    post:
      summary: Upload model
      description: Upload and register a new neuromorphic model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelUpload'
      responses:
        '201':
          description: Model uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'

  /models/{model_id}:
    get:
      summary: Get model details
      description: Returns detailed information about a specific model
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Model details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Model'
        '404':
          description: Model not found

    delete:
      summary: Delete model
      description: Removes a model from the system
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Model deleted successfully
        '404':
          description: Model not found

  # Execution Endpoints
  /execute/{model_id}/build:
    post:
      summary: Build execution plan
      description: Creates an execution plan for a model on specified backend
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: backend
          in: query
          schema:
            type: string
            default: cpu-sim
            description: Target backend for execution
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Optional execution parameters
      responses:
        '200':
          description: Plan built successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionPlan'

  /execute/{model_id}/run:
    post:
      summary: Execute model
      description: Runs a model with provided inputs and generates traces
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
        - name: backend
          in: query
          schema:
            type: string
            default: cpu-sim
        - name: async
          in: query
          schema:
            type: boolean
            default: false
            description: Execute asynchronously
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '200':
          description: Execution completed synchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionResult'
        '202':
          description: Execution started asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionJob'
        '404':
          description: Model not found

  /execute/job/{job_id}:
    get:
      summary: Get execution job status
      description: Returns status of an asynchronous execution job
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionJob'

  # Trace and Analysis
  /traces/{trace_id}:
    get:
      summary: Get trace data
      description: Retrieves trace data by ID
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
        - name: format
          in: query
          schema:
            type: string
            enum: [json, jsonl]
            default: jsonl
      responses:
        '200':
          description: Trace data
          content:
            application/json:
              schema:
                type: object
                description: Trace data in requested format
            text/plain:
              schema:
                type: string
                description: JSONL formatted trace data

  /traces/{trace_id}/profile:
    get:
      summary: Get trace profile
      description: Returns statistical profile of trace data
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TraceProfile'

  /compare/traces:
    post:
      summary: Compare traces
      description: Performs conformance comparison between traces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TraceComparison'
      responses:
        '200':
          description: Comparison results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonResult'

  # SAL Streaming
  /sal/stream:
    post:
      summary: Stream SAL data
      description: Converts SAL URI data to Event Tensor format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SALRequest'
      responses:
        '200':
          description: Streaming successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SALResult'

  # Backend Management
  /backends:
    get:
      summary: List backends
      description: Returns list of available execution backends
      responses:
        '200':
          description: List of backends
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Backend'

  /backends/{backend_name}:
    get:
      summary: Get backend details
      description: Returns detailed information about a specific backend
      parameters:
        - name: backend_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backend details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Backend'
        '404':
          description: Backend not found

components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version, timestamp]
      properties:
        status:
          type: string
          enum: [healthy, degraded, unhealthy]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime_seconds:
          type: integer
        active_jobs:
          type: integer

    ValidationResponse:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            type: object
            properties:
              severity:
                type: string
                enum: [error, warning, info]
              code:
                type: string
              message:
                type: string
              location:
                type: object
                properties:
                  path:
                    type: string
                  line:
                    type: integer
                  column:
                    type: integer

    ValidationError:
      type: object
      required: [error, details]
      properties:
        error:
          type: string
        details:
          $ref: '#/components/schemas/ValidationResponse'

    ModelSummary:
      type: object
      required: [id, name, version]
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string
        profile:
          type: string
          enum: [BASE, REALTIME, LEARNING, LOWPOWER]
        domain:
          type: string
        created_at:
          type: string
          format: date-time

    Model:
      allOf:
        - $ref: '#/components/schemas/ModelSummary'
        - type: object
          properties:
            description:
              type: string
            author:
              type: string
            license:
              type: string
            eir_size_bytes:
              type: integer
            capabilities:
              type: array
              items:
                type: string

    ModelUpload:
      type: object
      required: [name, eir]
      properties:
        name:
          type: string
        version:
          type: string
          default: "1.0.0"
        description:
          type: string
        profile:
          type: string
          enum: [BASE, REALTIME, LEARNING, LOWPOWER]
          default: BASE
        domain:
          type: string
        eir:
          type: object
          description: EIR JSON document
        golden_trace:
          type: object
          description: Optional golden trace data

    ExecutionPlan:
      type: object
      required: [plan_id, backend, estimated_time_us]
      properties:
        plan_id:
          type: string
        backend:
          type: string
        estimated_time_us:
          type: integer
        memory_estimate_mb:
          type: number
        plan_details:
          type: object

    ExecutionRequest:
      type: object
      required: [inputs]
      properties:
        inputs:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              uri:
                type: string
              format:
                type: string
                enum: [json, jsonl]
              data:
                type: object
        plan_id:
          type: string
          description: Pre-built plan ID to use
        parameters:
          type: object
          description: Execution parameters

    ExecutionResult:
      type: object
      required: [job_id, status, traces]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [completed, failed]
        traces:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              format:
                type: string
              url:
                type: string
        execution_time_us:
          type: integer
        error:
          type: string

    ExecutionJob:
      type: object
      required: [job_id, status, created_at]
      properties:
        job_id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        created_at:
          type: string
          format: date-time
        progress_percent:
          type: number
          minimum: 0
          maximum: 100
        estimated_completion:
          type: string
          format: date-time

    TraceProfile:
      type: object
      required: [path, count, duration_us]
      properties:
        path:
          type: string
        count:
          type: integer
        duration_us:
          type: integer
        events_per_second:
          type: number
        val_min:
          type: number
        val_max:
          type: number
        val_mean:
          type: number
        top_channels:
          type: array
          items:
            type: object
            properties:
              channel:
                type: integer
              count:
                type: integer

    TraceComparison:
      type: object
      required: [golden, candidate]
      properties:
        golden:
          type: string
          description: Golden trace ID or URL
        candidate:
          type: string
          description: Candidate trace ID or URL
        eps_time_us:
          type: integer
          default: 100
        eps_numeric:
          type: number
          default: 0.00001

    ComparisonResult:
      type: object
      required: [ok, events_total, events_matched]
      properties:
        ok:
          type: boolean
        events_total:
          type: integer
        events_matched:
          type: integer
        time_violations:
          type: integer
        value_violations:
          type: integer
        max_time_error_us:
          type: integer
        max_value_error:
          type: number

    SALRequest:
      type: object
      required: [uri]
      properties:
        uri:
          type: string
          description: SAL URI (e.g., "vision.dvs://file?path=data.jsonl")
        output_format:
          type: string
          enum: [json, jsonl]
          default: jsonl
        sample_rate:
          type: integer
        window_ms:
          type: integer
        hop_ms:
          type: integer
        bands:
          type: integer
        rate_limit_keps:
          type: integer
        overflow_policy:
          type: string
          enum: [drop_head, drop_tail, block]

    SALResult:
      type: object
      required: [output_uri, telemetry]
      properties:
        output_uri:
          type: string
        telemetry:
          type: object
        records_processed:
          type: integer

    Backend:
      type: object
      required: [name, type, status]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cpu, gpu, neuromorphic]
        status:
          type: string
          enum: [available, busy, offline]
        capabilities:
          type: array
          items:
            type: string
        version:
          type: string
        description:
          type: string

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer

security:
  - ApiKeyAuth: []
  - BearerAuth: []