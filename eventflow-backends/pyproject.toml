[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventflow-backends"
version = "0.1.0"
description = "EventFlow backend plugin registry and CPU simulator"
readme = "README.md"
requires-python = ">=3.9"
license = "BSD-3-Clause"
authors = [{name="EventFlow Team"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "eventflow-core",
]

[project.entry-points.eventflow_backends]
loihi = "eventflow_backends.vendor_backends.loihi:LoihiBackend"
spinnaker = "eventflow_backends.vendor_backends.spinnaker:SpiNNakerBackend"
synsense = "eventflow_backends.vendor_backends.synsense:SynSenseBackend"

[tool.setuptools.packages.find]
where = ["."]
include = ["eventflow_backends*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
eventflow_backends = [
  "cpu_sim/*.json",
  "gpu_sim/*.json",
  "riscv_sim/*.json",
  "vendor_backends/loihi/*.json",
  "vendor_backends/spinnaker/*.json",
  "vendor_backends/synsense/*.json",
]
