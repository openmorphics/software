name: Build and Test Wheels

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Build all wheels with abi3 cp38 via PyO3; maturin respects abi3 if configured in Cargo/pyproject
  MATURIN_PEP517_ARGS: "--release --strip"

jobs:
  linux-manylinux:
    name: manylinux 2_28 (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Build eventflow-core wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2_28"
          target: ${{ matrix.target }}
          args: ${{ env.MATURIN_PEP517_ARGS }} -m eventflow-core/pyproject.toml --out dist

      - name: Build eventflow-modules wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2_28"
          target: ${{ matrix.target }}
          args: ${{ env.MATURIN_PEP517_ARGS }} -m eventflow-modules/pyproject.toml --out dist

      - name: Upload artifacts (manylinux ${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: wheels-manylinux-${{ matrix.target }}
          path: dist/*

  linux-musllinux:
    name: musllinux 1_2 (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Build eventflow-core wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "musllinux_1_2"
          target: ${{ matrix.target }}
          args: ${{ env.MATURIN_PEP517_ARGS }} -m eventflow-core/pyproject.toml --out dist

      - name: Build eventflow-modules wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "musllinux_1_2"
          target: ${{ matrix.target }}
          args: ${{ env.MATURIN_PEP517_ARGS }} -m eventflow-modules/pyproject.toml --out dist

      - name: Upload artifacts (musllinux ${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: wheels-musllinux-${{ matrix.target }}
          path: dist/*

  macos-universal2:
    name: macOS universal2
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build eventflow-core universal2
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: ${{ env.MATURIN_PEP517_ARGS }} --universal2 -m eventflow-core/pyproject.toml --out dist

      - name: Build eventflow-modules universal2
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: ${{ env.MATURIN_PEP517_ARGS }} --universal2 -m eventflow-modules/pyproject.toml --out dist

      - name: Upload artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-universal2
          path: dist/*

  windows-msvc:
    name: Windows MSVC x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build eventflow-core wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: ${{ env.MATURIN_PEP517_ARGS }} -m eventflow-core/pyproject.toml --out dist

      - name: Build eventflow-modules wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: ${{ env.MATURIN_PEP517_ARGS }} -m eventflow-modules/pyproject.toml --out dist

      - name: Upload artifacts (windows)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-msvc
          path: dist/*

  build-python-packages:
    name: Build pure Python wheels (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pure Python wheels
        run: |
          python -m pip install -U pip build
          mkdir -p dist
          for pkg in eventflow-sal eventflow-backends eventflow-cli eventflow-hub; do
            python -m build --wheel -o dist "$pkg"
          done
          ls -la dist

      - name: Upload artifacts (pure python)
        uses: actions/upload-artifact@v4
        with:
          name: wheels-pure-python
          path: dist/*

  test-wheels:
    name: Install and test wheels (Linux x86_64)
    needs: [linux-manylinux, linux-musllinux, macos-universal2, windows-msvc, build-python-packages]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download built wheels
        uses: actions/download-artifact@v4
        with:
          path: wheelhouse

      - name: Create venv and install wheels
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          python - <<'PY'
          import glob
          import pathlib
          import subprocess
          import sys
          from packaging.tags import sys_tags
          from packaging.utils import parse_wheel_filename

          wheel_paths = glob.glob("wheelhouse/**/*.whl", recursive=True)
          if not wheel_paths:
              raise SystemExit("no wheel artifacts found")

          supported = set(sys_tags())
          selected = []
          for path in wheel_paths:
              name = pathlib.Path(path).name
              _, _, _, tags = parse_wheel_filename(name)
              if tags & supported:
                  selected.append(path)

          if not selected:
              raise SystemExit("no wheels compatible with this Linux test runner")

          subprocess.check_call([sys.executable, "-m", "pip", "install", *selected])
          print(f"installed {len(selected)} compatible wheels")
          PY
          pip install -U pytest pytest-benchmark numpy

      - name: Run test suite (core)
        run: |
          . .venv/bin/activate
          pytest -q eventflow-core/tests

      - name: Run test suite (modules)
        run: |
          . .venv/bin/activate
          pytest -q eventflow-modules/tests

      - name: Run installed artifact smoke tests (CLI/runtime)
        run: |
          . .venv/bin/activate
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          def run(*args: str):
              proc = subprocess.run(["eventflow", *args], capture_output=True, text=True, check=False)
              if proc.returncode != 0:
                  raise SystemExit(f"command failed rc={proc.returncode}: {' '.join(args)}\nstdout={proc.stdout}\nstderr={proc.stderr}")
              try:
                  return json.loads(proc.stdout)
              except Exception as exc:
                  raise SystemExit(f"invalid JSON output for {' '.join(args)}: {exc}\nstdout={proc.stdout}") from exc

          ver = run("--json", "version")
          if "version" not in ver:
              raise SystemExit("version payload missing 'version'")

          backends = run("--json", "list-backends")
          names = backends.get("backends", [])
          if "cpu-sim" not in names:
              raise SystemExit(f"cpu-sim missing from backend list: {names}")

          trace_out = pathlib.Path("out/wheels_artifact_smoke.trace.jsonl")
          trace_out.parent.mkdir(parents=True, exist_ok=True)
          res = run(
              "--json",
              "run",
              "--eir",
              "examples/wakeword/eir.json",
              "--backend",
              "cpu-sim",
              "--input",
              "examples/wakeword/traces/inputs/audio_sample.jsonl",
              "--trace-out",
              str(trace_out),
          )
          if res.get("status") != "ok" or not trace_out.is_file():
              raise SystemExit(f"run smoke failed: {res}")
          PY

  bench-artifacts:
    name: Attach benchmark artifacts from Benchmarks workflow (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download bench-core artifact from Benchmarks
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: bench.yml
          pr: ${{ github.event.pull_request.number }}
          name: bench-core
          path: bench_artifacts/core
          workflow_conclusion: success
        continue-on-error: true

      - name: Download bench-modules artifact from Benchmarks
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: bench.yml
          pr: ${{ github.event.pull_request.number }}
          name: bench-modules
          path: bench_artifacts/modules
          workflow_conclusion: success
        continue-on-error: true

      - name: Upload bench-core (re-publish)
        if: ${{ hashFiles('bench_artifacts/core/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-core
          path: bench_artifacts/core/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload bench-modules (re-publish)
        if: ${{ hashFiles('bench_artifacts/modules/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: bench-modules
          path: bench_artifacts/modules/**
          if-no-files-found: ignore
          retention-days: 30
