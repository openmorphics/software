name: native-gates

on:
  workflow_dispatch:
    inputs:
      core_bucket_min:
        description: "Core bucket speedup threshold"
        required: false
        default: "1.5"
      core_fuse_min:
        description: "Core fuse speedup threshold"
        required: false
        default: "1.5"
      mod_pass_min:
        description: "Modules pass speedup threshold"
        required: false
        default: "1.3"
      mod_fuse_min:
        description: "Modules fuse speedup threshold"
        required: false
        default: "1.5"

jobs:
  native:
    name: Native parity + benchmark gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install maturin pytest pytest-benchmark numpy
          python -m pip install -e ./eventflow-core
          python -m pip install -e ./eventflow-modules

      - name: Build eventflow-core native
        working-directory: eventflow-core
        run: |
          python -m maturin develop -r

      - name: Build eventflow-modules native
        working-directory: eventflow-modules
        run: |
          python -m maturin develop -r

      - name: Run native parity gate (core)
        env:
          EF_NATIVE: "1"
        run: |
          python -m pytest -q eventflow-core/tests/test_native_parity.py

      - name: Run native benchmark gates (core + modules)
        env:
          EF_NATIVE: "1"
          EF_BENCH_GATE: "1"
          CORE_BUCKET_MIN: ${{ github.event.inputs.core_bucket_min || '1.5' }}
          CORE_FUSE_MIN: ${{ github.event.inputs.core_fuse_min || '1.5' }}
          MOD_PASS_MIN: ${{ github.event.inputs.mod_pass_min || '1.3' }}
          MOD_FUSE_MIN: ${{ github.event.inputs.mod_fuse_min || '1.5' }}
        run: |
          python -m pytest -q eventflow-core/tests/test_bench_gate_speedups.py
          python -m pytest -q eventflow-modules/tests/test_bench_gate_speedups.py

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-gates-benchmarks
          path: |
            eventflow-core/.benchmarks/**
            eventflow-modules/.benchmarks/**
            .benchmarks/**
          if-no-files-found: ignore
          retention-days: 30
