[workspace]
members = [
    "vcfo-core",
    "vcfo-runway",
    "vcfo-viz",
    "vcfo-reports",
    "vcfo-edu",
    "vcfo-cli",
    "vcfo-api",
]
resolver = "2"

[workspace.dependencies]
# Core
chrono = "0.4"
rust_decimal = "1.35"
uuid = { version = "1.8", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"

# Visualization
plotters = "0.3"
plotters-svg = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
indicatif = "0.17"
colored = "2.1"

# API
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression"] }

# Reports
printpdf = "0.7"
calamine = "0.26"
handlebars = "6.1"
csv = "1.3"

# Testing
criterion = "0.5"
proptest = "1.5"
insta = "1.40"

# Utils
tracing = "0.1"
tracing-subscriber = "0.3"
config = "0.14"
directories = "5.0"